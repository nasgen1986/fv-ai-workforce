name: Test Worker safety checks

on:
  push:
    branches:
      - feature/dispatcher-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run-test-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Inspect deprecated transitive dependency
        run: npm ls node-domexception --all
      - name: Run isolated API safety tests (no deployment or AI inference)
        run: npm test
      - name: Run SQLite migration and transaction compatibility tests
        run: python3 test/migrations_test.py
      - name: Validate test Worker bundle (dry run only)
        run: npm run check
